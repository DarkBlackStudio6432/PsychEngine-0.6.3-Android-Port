name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      setupCommand:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string
      system:
        required: true
        type: string

env:
  HAXE_VERSION: 4.2.5
  PROJECT_NAME: PsychEngine

jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1.2.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android NDK
        if: inputs.system == 'Android'
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Limpar cache e builds antigos
        run: |
          echo "Removendo Haxelib antigo e builds..."
          rm -rf ~/.haxelib
          # evita erro se lime não estiver instalado ainda
          command -v lime && lime clean android || true

      - name: Setup Haxelib + Dependências
        run: |
          echo "💾 Configurando Haxelib..."
          haxelib setup ~/.haxelib

          echo "📦 Instalando dependências essenciais..."
          haxelib git linc_luajit https://github.com/PsychExtendedThings/linc_luajit --quiet
          haxelib install tjson --quiet
          haxelib install flixel 5.2.2 --quiet
          haxelib install flixel-addons 2.11.0 --quiet
          haxelib install flixel-ui 2.4.0 --quiet
          haxelib install hscript 2.4.0 --quiet
          haxelib git hxCodec https://github.com/PsychExtendedThings/hxCodec-0.6.3 --quiet
          haxelib git hxcpp https://github.com/PsychExtendedThings/hxcpp --quiet
          haxelib install flxanimate --quiet
          haxelib git lime https://github.com/PsychExtendedThings/lime-new --quiet
          haxelib install openfl 9.2.2 --quiet

          # Configuração Android apenas se necessário
          if [ "${{ inputs.system }}" = "Android" ]; then
            yes | haxelib run lime setup android
          fi

      - name: Run custom setup command
        run: ${{ inputs.setupCommand }}

      - name: Configure Android
        if: inputs.system == 'Android'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Compile
        run: haxelib run lime build ${{ inputs.buildArgs }}

      - name: Make IPA For iOS Simulator
        if: inputs.system == 'iOS-Sim'
        run: |
          cd export/release/ios/build/Release-iphonesimulator
          mkdir Payload
          mv *.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Make IPA For iOS
        if: inputs.system == 'iOS'
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir Payload
          mv *.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
